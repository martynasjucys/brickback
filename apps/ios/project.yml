name: BrickBack
options:
  bundleIdPrefix: com.brickback
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # S7 i18n: English is the source language. Lithuanian ships in Localizable.xcstrings (the
  # String Catalog compiler emits lt.lproj); CFBundleLocalizations in Info.plist declares both.
  developmentLanguage: en


configs:
  Debug: debug
  Release: release

# Local domain/data package + (future) remote SPM deps. GRDB + supabase-swift are
# declared inside BrickBackKit/Package.swift and stay internal to the package, so the
# SwiftUI app target links only BrickBackKit (it never imports Supabase directly).
packages:
  BrickBackKit:
    path: BrickBackKit
  # Image loading + disk cache for catalog thumbnails (S2). Only the SwiftUI app links this;
  # the domain package (BrickBackKit) stays UI-free.
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.8.0"

settings:
  base:
    SWIFT_VERSION: "5.0"            # language mode 5 for now (S0: warnings, not errors)
    DEVELOPMENT_TEAM: 2ZK892FL89    # paid Apple Developer team (automatic signing)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  BrickBack:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BrickBack
    dependencies:
      - package: BrickBackKit
        product: BrickBackKit
      - package: Nuke
        product: NukeUI
    configFiles:
      Debug: BrickBack/Config/Debug.xcconfig
      Release: BrickBack/Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brickback.brickback
        INFOPLIST_FILE: BrickBack/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrickBack/Resources/BrickBack.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"

  # The app target's own tests. BrickBackKit has its own (`swift test`, 42 of them), but the kit is
  # pure domain/data — Router, Route and AppEnvironment live in the app, which had no test bundle at
  # all until S10. Added to pin navigation behaviour before the adaptive-layout rework moves it.
  BrickBackTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BrickBackTests
    dependencies:
      - target: BrickBack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brickback.brickback.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BrickBack:
    build:
      targets:
        BrickBack: all
        BrickBackTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BrickBackTests
